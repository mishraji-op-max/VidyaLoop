<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VidyaLoop — Learn. Teach. Earn. Repeat.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<!-- ===== SUPABASE (real backend) ===== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
:root[data-theme="dark"]{
  --bg:#0A0D14; --bg2:#0D1119; --surface:#131826; --surface2:#1A2032; --surface3:#212842;
  --text:#E9ECF5; --muted:#8B93AA; --muted2:#5E6579; --border:#232B41; --border2:#2E3752;
  --violet:#8B5CF6; --violet2:#A78BFA; --cyan:#22D3EE; --pink:#FF3EA5; --amber:#FFB020; --green:#34D399; --red:#FB7185;
  --shadow: 0 10px 40px rgba(0,0,0,.45);
  --glass: rgba(19,24,38,.72);
}
:root[data-theme="light"]{
  --bg:#F2F4FA; --bg2:#EAEDF6; --surface:#FFFFFF; --surface2:#F5F7FC; --surface3:#ECEFFA;
  --text:#151826; --muted:#5B6178; --muted2:#8A90A6; --border:#DEE2F0; --border2:#CBD1E8;
  --violet:#7C3AED; --violet2:#6D28D9; --cyan:#0891B2; --pink:#DB2777; --amber:#B45309; --green:#047857; --red:#DC2626;
  --shadow: 0 10px 34px rgba(30,40,80,.10);
  --glass: rgba(255,255,255,.75);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:var(--bg); color:var(--text);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  position:relative;
  overflow-x:hidden;
  transition:background .3s ease, color .3s ease;
}
h1,h2,h3,h4,.display{font-family:'Space Grotesk',sans-serif; letter-spacing:-0.02em;}
.mono{font-family:'JetBrains Mono',monospace;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
::selection{background:var(--violet); color:#fff;}

/* ---------- Neon background ---------- */
#neonbg{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;}
.blob{position:absolute; border-radius:50%; filter:blur(90px); opacity:.35; mix-blend-mode:screen;}
:root[data-theme="light"] .blob{opacity:.22; mix-blend-mode:normal; filter:blur(110px);}
.blob1{width:520px; height:520px; background:var(--violet); top:-160px; left:-120px; animation:float1 22s ease-in-out infinite;}
.blob2{width:460px; height:460px; background:var(--cyan); bottom:-140px; right:-100px; animation:float2 26s ease-in-out infinite;}
.blob3{width:380px; height:380px; background:var(--pink); top:40%; left:60%; animation:float3 30s ease-in-out infinite;}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,80px)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-70px,-50px)}}
@keyframes float3{0%,100%{transform:translate(0,0)}50%{transform:translate(-90px,60px)}}
.gridlines{position:absolute; inset:0; background-image:
  linear-gradient(var(--border) 1px, transparent 1px),
  linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size:64px 64px; opacity:.35; mask-image:radial-gradient(ellipse 80% 60% at 50% 0%, #000 40%, transparent 100%);}
:root[data-theme="light"] .gridlines{opacity:.5;}
.loopsvg{position:absolute; opacity:.14;}
:root[data-theme="light"] .loopsvg{opacity:.09;}
.loopsvg.a{top:8%; right:6%; width:260px;}
.loopsvg.b{bottom:6%; left:4%; width:200px;}

/* ---------- Layout ---------- */
#app{position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column;}
.wrap{max-width:1180px; margin:0 auto; padding:0 24px; width:100%;}

/* Navbar */
.navbar{position:sticky; top:0; z-index:50; backdrop-filter:blur(14px); background:var(--glass); border-bottom:1px solid var(--border);}
.navinner{display:flex; align-items:center; gap:18px; padding:14px 24px; max-width:1180px; margin:0 auto;}
.brand{display:flex; align-items:center; gap:10px; font-weight:700; font-size:19px; cursor:pointer; flex-shrink:0;}
.brand .ring{width:30px; height:30px;}
.navlinks{display:flex; gap:4px; flex:1; overflow-x:auto;}
.navlinks button{background:none; border:none; color:var(--muted); padding:8px 12px; border-radius:8px; font-size:14px; font-weight:500; white-space:nowrap; transition:all .15s;}
.navlinks button:hover{color:var(--text); background:var(--surface2);}
.navlinks button.active{color:var(--text); background:var(--surface3); box-shadow:inset 0 0 0 1px var(--border2);}
.navright{display:flex; align-items:center; gap:10px; flex-shrink:0;}
.searchbox{display:flex; align-items:center; gap:6px; background:var(--surface2); border:1px solid var(--border); border-radius:20px; padding:6px 12px; width:180px;}
.searchbox input{background:none; border:none; outline:none; color:var(--text); font-size:13px; width:100%;}
.iconbtn{width:36px; height:36px; border-radius:10px; border:1px solid var(--border); background:var(--surface2); color:var(--text); display:flex; align-items:center; justify-content:center; position:relative; font-size:15px;}
.iconbtn:hover{border-color:var(--border2);}
.badgeDot{position:absolute; top:-4px; right:-4px; background:var(--pink); color:#fff; font-size:10px; font-weight:700; width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center;}
.avatar{width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; color:#fff; flex-shrink:0;}
.stat-pill{display:flex; align-items:center; gap:6px; background:var(--surface2); border:1px solid var(--border); padding:5px 10px; border-radius:20px; font-size:12.5px; font-weight:600;}

/* Notification dropdown */
.dropdown{position:absolute; top:52px; right:0; width:320px; background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow); z-index:80; max-height:400px; overflow:auto; display:none;}
.dropdown.open{display:block;}
.dropdown-item{padding:12px 16px; border-bottom:1px solid var(--border); font-size:13px;}
.dropdown-item:last-child{border-bottom:none;}
.dropdown-item .t{font-weight:600; margin-bottom:2px;}
.dropdown-item .d{color:var(--muted); font-size:12px;}

/* Cards / generic */
.card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px;}
.card-hover{transition:transform .18s ease, box-shadow .18s ease, border-color .18s;}
.card-hover:hover{transform:translateY(-3px); box-shadow:var(--shadow); border-color:var(--border2);}
.grid{display:grid; gap:18px;}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:900px){.grid.cols-3,.grid.cols-4{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr;} .navlinks{display:none;} .searchbox{display:none;}}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:11px 20px; border-radius:11px; font-weight:600; font-size:14px; border:1px solid transparent; transition:all .15s;}
.btn-primary{background:linear-gradient(135deg,var(--violet),var(--pink)); color:#fff; box-shadow:0 6px 20px -6px rgba(139,92,246,.6);}
.btn-primary:hover{filter:brightness(1.08); transform:translateY(-1px);}
.btn-outline{background:var(--surface2); border-color:var(--border); color:var(--text);}
.btn-outline:hover{border-color:var(--border2);}
.btn-ghost{background:none; color:var(--muted);}
.btn-ghost:hover{color:var(--text);}
.btn-sm{padding:7px 13px; font-size:12.5px; border-radius:8px;}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none !important;}
.btn-danger{background:rgba(251,113,133,.12); color:var(--red); border-color:rgba(251,113,133,.3);}
.btn-block{width:100%;}

input,textarea,select{width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:11px 13px; color:var(--text); font-size:14px; font-family:inherit; outline:none; transition:border-color .15s;}
input:focus,textarea:focus,select:focus{border-color:var(--violet);}
label{font-size:12.5px; font-weight:600; color:var(--muted); margin-bottom:6px; display:block;}
.field{margin-bottom:14px;}
.formrow{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media(max-width:640px){.formrow{grid-template-columns:1fr;}}

.tag{display:inline-flex; align-items:center; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; letter-spacing:.02em;}
.tag-violet{background:rgba(139,92,246,.15); color:var(--violet2);}
.tag-cyan{background:rgba(34,211,238,.15); color:var(--cyan);}
.tag-green{background:rgba(52,211,153,.15); color:var(--green);}
.tag-amber{background:rgba(255,176,32,.15); color:var(--amber);}
.tag-pink{background:rgba(255,62,165,.15); color:var(--pink);}
.tag-muted{background:var(--surface3); color:var(--muted);}

.pagewrap{padding:32px 0 80px;}
.section-title{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.section-title h2{font-size:20px;}
.eyebrow{font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--violet2); margin-bottom:8px;}
.muted{color:var(--muted);}
.small{font-size:12.5px;}
hr.div{border:none; border-top:1px solid var(--border); margin:20px 0;}

/* progress bars */
.bar{height:8px; background:var(--surface3); border-radius:6px; overflow:hidden;}
.bar > div{height:100%; border-radius:6px; background:linear-gradient(90deg,var(--violet),var(--cyan));}

/* Landing */
.hero{padding:90px 0 60px; text-align:center; position:relative;}
.hero h1{font-size:56px; line-height:1.05; max-width:820px; margin:0 auto 18px;}
.hero .grad{background:linear-gradient(135deg,var(--violet),var(--pink),var(--cyan)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.hero p{font-size:17px; color:var(--muted); max-width:560px; margin:0 auto 30px;}
@media(max-width:640px){.hero h1{font-size:36px;}}
.loopdiagram{display:flex; align-items:center; justify-content:center; gap:0; flex-wrap:wrap; margin:60px auto 0; max-width:900px;}
.loopnode{display:flex; flex-direction:column; align-items:center; gap:8px; width:120px;}
.loopnode .dot{width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:20px; border:1px solid var(--border2); background:var(--surface);}
.loopnode span{font-size:12px; font-weight:700; color:var(--muted); text-align:center;}
.loopchevron{color:var(--muted2); font-size:18px; margin:0 -6px;}
@media(max-width:900px){.loopchevron{display:none;}}

/* Auth */
.authwrap{min-height:calc(100vh - 70px); display:flex; align-items:center; justify-content:center; padding:40px 20px;}
.authcard{width:100%; max-width:420px; padding:34px;}

/* Dashboard stat cards */
.statbig{display:flex; align-items:center; gap:14px;}
.statbig .ic{width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0;}
.statbig .n{font-size:24px; font-weight:700; font-family:'JetBrains Mono',monospace;}
.statbig .l{font-size:12px; color:var(--muted);}

.quickgrid{display:grid; grid-template-columns:repeat(6,1fr); gap:12px;}
@media(max-width:900px){.quickgrid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:500px){.quickgrid{grid-template-columns:repeat(2,1fr);}}
.qbtn{display:flex; flex-direction:column; align-items:center; gap:8px; padding:16px 8px; border-radius:14px; text-align:center; font-size:12px; font-weight:600;}
.qbtn .ic{font-size:22px;}

/* Resource card */
.rescard{display:flex; flex-direction:column; gap:10px; cursor:pointer;}
.rescard .thumb{height:100px; border-radius:10px; background:linear-gradient(135deg,var(--surface3),var(--surface2)); display:flex; align-items:center; justify-content:center; font-size:28px; position:relative; overflow:hidden;}
.rescard .thumb::after{content:""; position:absolute; inset:0; background:linear-gradient(135deg, rgba(139,92,246,.18), transparent 60%);}
.rescard h4{font-size:14.5px; line-height:1.3;}
.rescard .meta{display:flex; gap:6px; flex-wrap:wrap;}
.rescard .foot{display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:8px; border-top:1px solid var(--border);}
.score{font-family:'JetBrains Mono',monospace; font-weight:700;}
.stars{color:var(--amber); font-size:12.5px;}

/* Filters bar */
.filterbar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px;}
.filterbar select, .filterbar input{width:auto; min-width:120px;}

/* Resource detail */
.rdgrid{display:grid; grid-template-columns:1.6fr 1fr; gap:24px; align-items:start;}
@media(max-width:900px){.rdgrid{grid-template-columns:1fr;}}
.previewpage{aspect-ratio:3/4; background:var(--surface2); border:1px dashed var(--border2); border-radius:10px; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:6px; color:var(--muted); font-size:12px;}
.prevgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
@media(max-width:640px){.prevgrid{grid-template-columns:repeat(2,1fr);}}
.proscons{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media(max-width:640px){.proscons{grid-template-columns:1fr;}}
.proscons ul{list-style:none; display:flex; flex-direction:column; gap:6px; font-size:13px;}
.proscons li{padding-left:18px; position:relative;}
.pros li::before{content:"+"; position:absolute; left:0; color:var(--green); font-weight:700;}
.cons li::before{content:"–"; position:absolute; left:0; color:var(--red); font-weight:700;}

/* Doubts */
.doubtcard{display:flex; gap:14px; padding:16px 0; border-bottom:1px solid var(--border);}
.doubtcard:last-child{border-bottom:none;}
.votecol{display:flex; flex-direction:column; align-items:center; gap:2px; width:44px; flex-shrink:0;}
.votecol .n{font-weight:700; font-family:'JetBrains Mono',monospace;}
.answercard{border:1px solid var(--border); border-radius:12px; padding:14px; margin-top:10px;}
.answercard.accepted{border-color:var(--green); background:rgba(52,211,153,.06);}

/* Chat */
.chatwin{display:flex; flex-direction:column; height:560px; border:1px solid var(--border); border-radius:16px; overflow:hidden; background:var(--surface);}
.chatlog{flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px;}
.msg{max-width:80%; padding:12px 15px; border-radius:14px; font-size:13.5px; line-height:1.5;}
.msg.user{align-self:flex-end; background:linear-gradient(135deg,var(--violet),var(--pink)); color:#fff; border-bottom-right-radius:4px;}
.msg.ai{align-self:flex-start; background:var(--surface2); border:1px solid var(--border); border-bottom-left-radius:4px;}
.chatinputbar{display:flex; gap:8px; padding:14px; border-top:1px solid var(--border);}
.suggestchips{display:flex; gap:8px; flex-wrap:wrap; padding:0 14px 12px;}
.chip{background:var(--surface2); border:1px solid var(--border); padding:6px 12px; border-radius:20px; font-size:12px; font-weight:600;}
.chip:hover{border-color:var(--border2);}

/* Focus */
.timerCircle{width:220px; height:220px; border-radius:50%; border:3px solid var(--border); display:flex; align-items:center; justify-content:center; flex-direction:column; margin:0 auto; position:relative; background:conic-gradient(from -90deg, var(--violet) var(--pct,0%), transparent 0);}
.timerCircle .inner{width:186px; height:186px; border-radius:50%; background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center;}
.timerCircle .t{font-size:34px; font-weight:700; font-family:'JetBrains Mono',monospace;}

/* Quiz */
.qopt{display:block; padding:12px 14px; border:1px solid var(--border); border-radius:10px; margin-bottom:8px; cursor:pointer; font-size:14px; transition:all .12s;}
.qopt:hover{border-color:var(--border2);}
.qopt.selected{border-color:var(--violet); background:rgba(139,92,246,.1);}
.qopt.correct{border-color:var(--green); background:rgba(52,211,153,.1);}
.qopt.incorrect{border-color:var(--red); background:rgba(251,113,133,.1);}

/* Table (admin) */
table{width:100%; border-collapse:collapse; font-size:13px;}
th{text-align:left; color:var(--muted); font-weight:600; padding:10px 12px; border-bottom:1px solid var(--border); font-size:11.5px; text-transform:uppercase; letter-spacing:.05em;}
td{padding:12px; border-bottom:1px solid var(--border); vertical-align:middle;}
tr:last-child td{border-bottom:none;}

.tabbar{display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:20px; overflow-x:auto;}
.tabbtn{padding:10px 16px; font-weight:600; font-size:13.5px; color:var(--muted); border-bottom:2px solid transparent; white-space:nowrap;}
.tabbtn.active{color:var(--text); border-color:var(--violet);}

.empty{text-align:center; padding:50px 20px; color:var(--muted);}
.empty .ic{font-size:36px; margin-bottom:10px;}

.toastwrap{position:fixed; bottom:24px; right:24px; z-index:200; display:flex; flex-direction:column; gap:10px;}
.toast{background:var(--surface); border:1px solid var(--border2); border-radius:12px; padding:13px 18px; box-shadow:var(--shadow); font-size:13.5px; font-weight:500; animation:slidein .25s ease; max-width:300px;}
@keyframes slidein{from{transform:translateX(30px); opacity:0} to{transform:translateX(0); opacity:1}}

.footerbar{border-top:1px solid var(--border); padding:26px 0; text-align:center; color:var(--muted2); font-size:12.5px; margin-top:auto;}
.trust{display:flex; gap:8px; align-items:flex-start; background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:12px 14px; font-size:12.5px; color:var(--muted);}
</style>
</head>

<div id="neonbg">

  <svg class="loopsvg a" viewBox="0 0 200 200"><circle cx="100" cy="100" r="80" fill="none" stroke="var(--cyan)" stroke-width="1.5" stroke-dasharray="6 10"/><circle cx="100" cy="100" r="55" fill="none" stroke="var(--violet)" stroke-width="1.5"/></svg>
  <svg class="loopsvg b" viewBox="0 0 200 200"><polygon points="100,10 190,60 190,140 100,190 10,140 10,60" fill="none" stroke="var(--pink)" stroke-width="1.5"/></svg>
</div>

<div id="app"></div>
<div class="toastwrap" id="toastwrap"></div>

<script>
/* =========================================================
   VIDYALOOP — MVP DEMO APP
   Frontend-only prototype. All "AI" and backend calls are
   mocked in the AI / DATA layer below so the whole product
   is demonstrable end-to-end. Swap these for real services
   (Supabase + an LLM API) without touching the view layer.
========================================================= */

/* ---------------- DATA LAYER (mock DB) ---------------- */
const SUBJECTS = ["Mathematics","Physics","Chemistry","Biology","English","Social Science"];

/* ---------------- SUPABASE (real backend) ----------------

/* Fill these in after deploying the two Edge Functions (see backend/README.md).

/* Simple key-value layer on top of a Postgres table (see setup SQL at the
   bottom of this file) — keeps the rest of the app's code (persistUser,
   persistCatalog, loadAllUsers, etc.) unchanged. Falls back to in-memory
   storage (this session only) if Supabase isn't configured. */
const _memoryStore = { shared:{}, local:{} };
const Store = {
  async get(key){
    if(usingRealBackend){
      const { data, error } = await sb.from("kv").select("value").eq("key", key).maybeSingle();
      if(error){ console.error("Store.get failed:", error); return null; }
      return data ? data.value : null;
    }
    return _memoryStore.shared[key] ?? null;
  },
  async set(key, value){
    if(usingRealBackend){
      const { error } = await sb.from("kv").upsert({ key, value });
      if(error){ console.error("Store.set failed:", error); return false; }
      return true;
    }
    _memoryStore.shared[key] = value;
    return true;
  },
  async list(prefix){
    if(usingRealBackend){
      const { data, error } = await sb.from("kv").select("key").like("key", prefix+"%");
      if(error){ console.error("Store.list failed:", error); return []; }
      return data.map(d=>d.key);
    }
    return Object.keys(_memoryStore.shared).filter(k=>!prefix || k.startsWith(prefix));
  }
};

/* Real file storage (Supabase Storage) for uploaded PDFs/images — no size
   limits like a database row would have. Returns a real hosted URL.
   Bucket names match the ones already created in Supabase Storage. */
async function uploadFileToStorage(resId, file){
  if(!usingRealBackend) return null;
  const path = resId+"/"+file.name;
  const { error } = await sb.storage.from("resources").upload(path, file, { upsert: true });
  if(error){ console.error("File upload failed:", error); return null; }
  const { data } = sb.storage.from("resources").getPublicUrl(path);
  return data.publicUrl;
}
async function getResourceFileUrl(r){
  if(!r?.id) return null;
  let fileName=r.fileName||null;
  let fileType=r.fileType||null;
  let fileUrl=r.fileUrl||null;

  if(usingRealBackend){
    // Refresh the DB row because older client caches may have has_file/file_name=false/null.
    try{
      const {data,rowError}=await sb.from("resources").select("id,has_file,file_name,file_type,file_url").eq("id",r.id).maybeSingle();
      if(data){ fileName=data.file_name||fileName; fileType=data.file_type||fileType; fileUrl=data.file_url||fileUrl; r.hasFile=!!data.has_file; r.fileName=fileName; r.fileType=fileType; r.fileUrl=fileUrl; }
    }catch(e){ console.warn("Resource metadata refresh failed:",e); }

    // If the filename column is missing, discover the first object inside this resource's folder.
    if(!fileName){
      try{
        const {data,error}=await sb.storage.from("resources").list(r.id,{limit:100,sortBy:{column:"name",order:"asc"}});
        if(!error && data?.length){
          const file=data.find(x=>x.name && !x.id?.endsWith("/")) || data.find(x=>x.name);
          if(file) fileName=file.name;
        }
      }catch(e){ console.warn("Resource storage listing failed:",e); }
    }

    if(fileName){
      const path=r.id+"/"+fileName;
      try{
        const {data,error}=await sb.storage.from("resources").createSignedUrl(path,3600);
        if(!error && data?.signedUrl) return data.signedUrl;
        console.warn("Signed URL failed:",error);
      }catch(e){ console.warn("Signed URL exception:",e); }
      try{
        const {data}=sb.storage.from("resources").getPublicUrl(path);
        if(data?.publicUrl) return data.publicUrl;
      }catch(e){}
    }
  }
  return fileUrl||null;
}

async function openResourceFile(id){

  if(!r.fileName && !r.fileUrl) return toast("The uploaded file could not be located in Storage.");
  const url = await getResourceFileUrl(r);

function normalizeUsername(value){
  return (value||"").trim().toLowerCase().replace(/\s+/g," ");
}
function validateUsername(value){
  const username = (value||"").trim();
  if(username.length < 3) return "Username must be at least 3 characters.";
  if(username.length > 30) return "Username must be 30 characters or fewer.";
  if(!/^[A-Za-z0-9][A-Za-z0-9._ -]*$/.test(username)) return "Username can use letters, numbers, spaces, dots, hyphens and underscores.";
  if(!/[A-Za-z0-9]/.test(username)) return "Username must contain at least one letter or number.";
  return null;
}
function slugEmail(name){ return name.trim().toLowerCase().replace(/[^a-z0-9]+/g,".").replace(/^\.+|\.+$/g,"")+"@vidyaloop.local"; }

function userKey(name){ return "user:"+normalizeUsername(name); }

function focusStorageKey(){
  const id = state.user?._authUserId || state.user?.username || state.user?.id;
  return id ? "vidyaloop:focus:v2:"+id : "vidyaloop:focus:v2:guest";
}
function focusKvKey(){
  const id = state.user?._authUserId || state.user?.username || state.user?.id;
  return id ? "focus:"+id : null;
}
function focusSnapshot(){
  return {
    log: Array.isArray(state.focus.log) ? state.focus.log : [],
    active: !!state.focus.active,
    paused: !!state.focus.paused,
    startedAt: state.focus.startedAt || null,
    elapsed: Number(state.focus.elapsed)||0,
    subject: state.focus.subject || "",
    savedAt: Date.now()
  };
}
function saveFocusLocal(){
  try{
    const snap=focusSnapshot();
    localStorage.setItem(focusStorageKey(), JSON.stringify(snap));
    // A second key keyed by username helps if an auth/session identifier changes.
    if(state.user?.username) localStorage.setItem("vidyaloop:focus:v2:user:"+normalizeUsername(state.user.username), JSON.stringify(snap));
  }catch(e){ console.warn("Focus local save failed:", e); }
}
async function saveFocusPersistent(){
  saveFocusLocal();
  const key=focusKvKey();
  if(usingRealBackend && key){
    try{ await Store.set(key, JSON.stringify(focusSnapshot()), true); }
    catch(e){ console.warn("Focus KV save failed:",e); }
  }
}
function readLocalFocus(){
  const keys=[focusStorageKey()];
  if(state.user?.username) keys.push("vidyaloop:focus:v2:user:"+normalizeUsername(state.user.username));
  for(const k of keys){
    try{ const raw=localStorage.getItem(k); if(raw) return JSON.parse(raw); }catch(e){}
  }
  return null;
}
async function restoreFocusPersistence(){
  let saved=readLocalFocus();
  const key=focusKvKey();
  if(usingRealBackend && key){
    try{
      const raw=await Store.get(key);
      if(raw){ const kv=JSON.parse(raw); if(!saved || (kv.savedAt||0)>(saved.savedAt||0)) saved=kv; }
    }catch(e){ console.warn("Focus KV restore failed:",e); }
  }
  if(!saved) return;
  if(Array.isArray(saved.log)) state.focus.log=saved.log;
  if(saved.active){
    state.focus.active=true;
    state.focus.paused=!!saved.paused;
    state.focus.subject=saved.subject||"General";
    state.focus.elapsed=Number(saved.elapsed)||0;
    if(!state.focus.paused && saved.startedAt){
      state.focus.startedAt=Number(saved.startedAt);
      state.focus.elapsed=Math.max(state.focus.elapsed,Date.now()-state.focus.startedAt);
    }else state.focus.startedAt=saved.startedAt||Date.now();
    startFocusInterval();
  }else{
    state.focus.active=false;
    state.focus.paused=false;
    state.focus.startedAt=null;
    state.focus.elapsed=0;
  }
}
function startFocusInterval(){
  clearInterval(state.focus.timer);
  state.focus.timer=setInterval(()=>{
    if(state.focus.active && !state.focus.paused){
      state.focus.elapsed=Math.max(0,Date.now()-state.focus.startedAt);
      saveFocusLocal();
      renderFocusTimerOnly();
    }
  },1000);
}

async function loadAllUsers(){
  if(usingRealBackend){
    const [profilesRes, pointsRes] = await Promise.all([
      sb.from("profiles").select("*"),
      sb.from("reward_points").select("*")
    ]);
    if(profilesRes.error){
      console.error("loadAllUsers profiles error:", profilesRes.error);
      toast("Couldn't load users: "+profilesRes.error.message);
      return;
    }
    if(pointsRes.error){
      console.error("loadAllUsers reward_points error:", pointsRes.error);
      toast("Couldn't load user points: "+pointsRes.error.message);
      return;
    }
    const pointsByUser = {};
    (pointsRes.data||[]).forEach(p=>{ pointsByUser[p.user_id] = p.balance ?? 0; });
    const usernameByUser = {};
    try{
      const keys = await Store.list("user:");
      for(const k of keys){
        const raw = await Store.get(k);
        if(raw){ try{ const rec = JSON.parse(raw); if(rec.authUserId) usernameByUser[rec.authUserId] = rec.username || k.slice(5); }catch(e){} }
      }
    }catch(e){ console.warn("Username index unavailable:", e); }
    state.allUsersCache = (profilesRes.data||[]).map(p=>({
      id:p.id,
      name:p.name || "",
      fullName:p.name || "",
      username:usernameByUser[p.id] || p.name || "—",
      class:p.class ?? "—",
      board:p.board || "—",
      points:pointsByUser[p.id] ?? 0,
      reputation:p.reputation ?? 50,
      firstLogin:p.join_date ? new Date(p.join_date).getTime() : Date.now(),
      lastLogin:p.created_at ? new Date(p.created_at).getTime() : Date.now(),
      loginCount:0,
      status:p.status || "active",
      owner:p.is_admin === true
    })).sort((a,b)=>b.lastLogin-a.lastLogin);
    render();
    return;
  }
  const keys = await Store.list("user:", true);
  const list = [];
  for(const k of keys){
    const raw = await Store.get(k, true);
    if(raw){ try{ list.push(JSON.parse(raw)); }catch(e){} }
  }
  state.allUsersCache = list.sort((a,b)=>b.lastLogin-a.lastLogin);
  render();
}

    score += randInt(-4,8);
    score = Math.max(45, Math.min(98, score));
    const price = Math.min(ADMIN_CONFIG.maxResourcePrice, Math.max(12, Math.round(score*0.75 + pages*1.4)));
    const confidence = score>85?"High":score>65?"Medium":"Low";
    const strengths = ["Good topic coverage for "+subject,"Clear structure and headings","Reasonable length for the chapter"].slice(0, score>75?3:2);
    const weaknesses = score<80 ? ["Could include more worked examples","Add diagrams where relevant","Proofread for clarity"].slice(0,2) : ["Consider adding a couple of advanced practice questions"];
    return { score, price, confidence, strengths, weaknesses };
  },
  explainDoubt(qLower){
    const match = KNOWLEDGE_BASE.find(k => k.keywords.some(kw=>qLower.includes(kw)));
    return match ? match.explanation : null;
  },
  summarize(text){
    const clean = text.replace(/\s+/g,' ').trim();
    const sentences = clean.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [clean];
    if(sentences.length<=3) return clean;
    const stop = new Set(["the","is","a","an","and","or","of","to","in","on","for","with","that","this","it","as","are","was","were","be","by","at","from","which","their","its","but","not","also","has","have","had","you","your","they","we","he","she"]);
    const freq = {};
    clean.toLowerCase().split(/\W+/).forEach(w=>{ if(w && !stop.has(w) && w.length>2) freq[w]=(freq[w]||0)+1; });
    const scored = sentences.map((s,i)=>{
      const words = s.toLowerCase().split(/\W+/).filter(w=>w && !stop.has(w));
      const score = words.length ? words.reduce((sum,w)=>sum+(freq[w]||0),0)/words.length : 0;
      return {s:s.trim(), i, score};
    });
    const topCount = Math.max(2, Math.min(5, Math.ceil(sentences.length*0.3)));
    return scored.sort((a,b)=>b.score-a.score).slice(0,topCount).sort((a,b)=>a.i-b.i).map(t=>t.s).join(' ');
  },
  assistantReply(query, ctx){
    const rawQ = query.trim();
    const q = rawQ.toLowerCase();

    // Intent 1: summarize/explain pasted material
    const explicitSummarize = /^(summarize|summarise|explain this|tldr|tl;dr)[:\s]/i.test(rawQ);
    const looksLikePastedContent = rawQ.split(/\s+/).length > 45;
    if(explicitSummarize || looksLikePastedContent){
      const content = rawQ.replace(/^(summarize|summarise|explain this|tldr|tl;dr)[:\s]*/i,'');
      if(content.split(/\s+/).length < 15) return {text:"Paste a longer passage and I'll turn it into concise study notes.", resources:[]};
      const summary = AIService.summarize(content);
      return {text:`Study notes from what you shared:\n\n${summary}\n\nI can also help turn this into revision points or a quiz.`, resources:[]};
    }

    // Intent 2: explicitly ask to derive/make notes
    const wantsNotes = /\b(make|create|derive|prepare|give|generate|write)\b.*\b(notes|revision notes|study notes|summary|cheat sheet)\b/i.test(rawQ)
      || /\bnotes\s+(on|for|about)\b/i.test(rawQ);
    if(wantsNotes){
      const match = KNOWLEDGE_BASE.find(k=>k.keywords.some(kw=>q.includes(kw)));
      if(match){
        const title = match.keywords[0].replace(/\b\w/g,c=>c.toUpperCase());
        return {text:`Quick revision notes — ${title}\n\n${match.explanation}\n\nKey points to remember:\n• Learn the definition and main idea.\n• Note the important formula, relationship or example.\n• Practise one or two questions on the topic.`, resources:[]};
      }
      return {text:"I can turn a topic into concise revision notes when it matches my built-in study topics. Try a specific topic such as 'make notes on gravitation' or paste your own notes and I'll condense them.", resources:[]};
    }

    // Intent 3: direct doubt answering
    const looksLikeSearch = /class\s?\d|under\s?\d+|below\s?\d+|\d+\s?points?|cheapest|cheap notes|best rated|top rated|highest rat|compare|find|search|notes?\b/.test(q);
    const looksLikeQuestion = /^(what|why|how|explain|define|when|who|where|which|tell me|is|are|can|does|do|difference between)\b/.test(q) || q.endsWith("?");
    if(looksLikeQuestion && !looksLikeSearch){
      const explanation = AIService.explainDoubt(q);
      if(explanation) return {text:`${explanation}\n\nIf you want, ask me to make revision notes on this topic or find related notes on VidyaLoop.`, resources:[]};
      return {text:"I couldn't confidently answer that from my built-in study knowledge. Try rephrasing the doubt with the exact topic/chapter, or post it on the Doubts board so another student can help.", resources:[]};
    }

    // Intent 4: find/search resources
    let pool = RESOURCES.filter(r=>r.status==="approved");
    let note = "";
    const subjMatch = SUBJECTS.find(s=>q.includes(s.toLowerCase()));
    if(subjMatch){ pool = pool.filter(r=>r.subject===subjMatch); note+=` in ${subjMatch}`; }
    const clsMatch = q.match(/class\s?(\d{1,2})/);
    if(clsMatch){ const c=Number(clsMatch[1]); pool=pool.filter(r=>r.class===c); note+=` for Class ${c}`; }
    const underMatch = q.match(/under\s?(\d+)|below\s?(\d+)|(\d+)\s?points?/);
    if(underMatch){ const n=Number(underMatch[1]||underMatch[2]||underMatch[3]); if(n){ pool=pool.filter(r=>r.price<=n); note+=` under ${n} points`; } }
    const topicWords = ["chapter","topic","revision","notes","study guide","worksheet","practice"].filter(w=>q.includes(w));
    if(topicWords.length){
      const terms=q.replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>3 && !["find","best","notes","note","under","below","class","give","show","me","for","with","from","search","study","guide"].includes(w));
      const topicPool=pool.filter(r=>terms.some(t=>(r.title+" "+r.chapter+" "+r.description).toLowerCase().includes(t)));
      if(topicPool.length) pool=topicPool;
    }
    if(q.includes("highest rat") || q.includes("best rated") || q.includes("top rated")) pool=pool.sort((a,b)=>b.rating-a.rating);
    else if(q.includes("cheap") || q.includes("lowest")) pool=pool.sort((a,b)=>a.price-b.price);
    else pool=pool.sort((a,b)=>b.aiScore-a.aiScore);
    pool=pool.slice(0,3);
    if(!pool.length) return {text:`I couldn't find resources matching that${note}. Try a broader subject, class or budget, or upload the first resource for that topic.`, resources:[]};
    const top=pool[0];
    let text=`Here's what I found${note || ""}:\n\nTop pick: ${top.title}\nAI score: ${top.aiScore}/100 · Rating: ${top.rating}/5 · Price: ${top.price} pts\nTopic: ${top.chapter}\nWhy: ${top.pros[0]?.toLowerCase()||"good topic coverage"}.`;
    if(pool.length>1) text+=`\n\nI also found ${pool.length-1} more option${pool.length>2?"s":""}. Ask me to compare them.`;
    return {text, resources:pool};
  },
  generateQuiz(resource, count){
    const bank = QUESTION_BANKS[resource.subject] || QUESTION_BANKS.Mathematics;
    let qs = bank.slice();
    while(qs.length<count){ qs = qs.concat(bank); }
    // shuffle-ish
    qs = qs.sort(()=>Math.random()-0.5).slice(0,count);
    return qs.map((q,i)=>({...q, id:i}));
  }
};

/* Anti-abuse: caps how many Reward Points a student can EARN (not spend) per day.
   Returns the amount actually granted (may be less than requested, or 0 if capped). */
function grantPoints(amount, reason){
  const u = state.user;
  const today = new Date().toDateString();
  if(u.pointsEarnedDate !== today){ u.pointsEarnedDate = today; u.pointsEarnedToday = 0; }
  const remaining = Math.max(0, ADMIN_CONFIG.dailyPointCap - u.pointsEarnedToday);
  const granted = Math.min(amount, remaining);
  if(granted <= 0){
    toast("Daily earning limit reached ("+ADMIN_CONFIG.dailyPointCap+" pts/day) — come back tomorrow to earn more.");
    return 0;
  }
  u.points += granted;
  u.pointsEarnedToday += granted;
  addTx(reason + (granted<amount? " (capped by daily limit)":""), granted);
  if(granted<amount) toast("Only +"+granted+" pts awarded — daily earning limit reached.");
  return granted;
}

async function hashPassword(pw){
  const enc = new TextEncoder().encode(pw||"");
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

/* Resources: Supabase is the source of truth. RESOURCES stays as an
   in-memory cache that view functions read from, but it's populated by
   this fetch — never persisted back to kv. Approved resources are
   visible to everyone; a creator additionally sees their own pending ones. */
async function loadResourcesFromDB(){
  if(!usingRealBackend) return;
  const uidNow = state.user?._authUserId;
  const [approvedRes, mineRes] = await Promise.all([
    sb.from("resources").select("*, profiles(name)").eq("status","approved").order("created_at",{ascending:false}),
    uidNow ? sb.from("resources").select("*, profiles(name)").eq("creator_id", uidNow).order("created_at",{ascending:false}) : Promise.resolve({data:[]})
  ]);
  const byId = {};
  (approvedRes.data||[]).forEach(r=> byId[r.id]=mapDbResource(r));
  (mineRes.data||[]).forEach(r=> byId[r.id]=mapDbResource(r));
  RESOURCES.length = 0;
  RESOURCES.push(...Object.values(byId));
  // Also update the admin pending queue from the DB (owner-only tab, harmless to compute for everyone).
  const { data: pending, error } = await sb.from("resources").select("*, profiles(name)").eq("status","pending");
  if(error){
    console.error("loadResourcesFromDB pending error:", error);
    toast("Couldn't load pending resources: "+error.message);
    return;
  }
  ADMIN_PENDING.length = 0;
  ADMIN_PENDING.push(...(pending||[]).map(mapDbResource));
  render();
}
window.loadResourcesFromDB = loadResourcesFromDB;

/* Purchases are stored in resource_purchases, not in the profile.
   Keep the local purchased list synchronized with the database so
   purchased resources survive reloads and appear in My Library. */
async function loadPurchasedResources(){
  if(!usingRealBackend || !state.user?._authUserId) return;
  const uidNow = state.user._authUserId;

  const { data: purchases, error: purchaseErr } = await sb
    .from("resource_purchases")
    .select("resource_id")
    .eq("user_id", uidNow);

  if(purchaseErr){
    console.error("loadPurchasedResources failed:", purchaseErr);
    toast("Couldn't load My Library: " + purchaseErr.message);
    return;
  }

  const ids = [...new Set((purchases || []).map(p => p.resource_id).filter(Boolean))];
  state.user.purchased = ids;

  if(ids.length){
    const { data: rows, error: resourceErr } = await sb
      .from("resources")
      .select("*")
      .in("id", ids);

    if(resourceErr){
      console.error("load purchased resources failed:", resourceErr);
      toast("Couldn't load purchased notes: " + resourceErr.message);
      return;
    }

    const byId = Object.fromEntries(RESOURCES.map(r => [r.id, r]));
    (rows || []).forEach(row => {
      const mapped = mapDbResource(row);
      if(!mapped.creator) mapped.creator = "Student";
      byId[mapped.id] = mapped;
    });
    RESOURCES.length = 0;
    RESOURCES.push(...Object.values(byId));
  }

  await persistUser();
  if(state.route === "library") render();
}
window.loadPurchasedResources = loadPurchasedResources;

    numRatings: r.num_ratings||0, purchases: r.purchases||0, price: r.price, recommendedPrice: r.price,
    status: r.status, pros: r.pros||[], cons: r.cons||[], covers: r.covers||[],

/* Pulls the account-critical fields (points, reputation, admin flag)
   from the real Supabase tables — these are the server-authoritative
   source once a real backend is connected, separate from the kv-blob
   profile which still holds the non-sensitive stuff (uploaded/purchased
   lists, quiz history, focus log, etc — kept in kv per design). */
async function fetchAccountData(authUserId){
  if(!usingRealBackend) return {};
  const [profileRes, pointsRes] = await Promise.all([
    sb.from("profiles").select("*").eq("id", authUserId).maybeSingle(),
    sb.from("reward_points").select("balance").eq("user_id", authUserId).maybeSingle()
  ]);
  const profile = profileRes.data;
  return {
    accountType: profile?.account_type,
    reputation: profile?.reputation,
    bio: profile?.bio,
    streak: profile?.streak,
    isAdminFlag: profile?.is_admin === true,
    points: pointsRes.data ? pointsRes.data.balance : undefined
  };
}

async function doLogin(){
  const username = (document.getElementById("loginName").value || "").trim();
  const cls = document.getElementById("loginClass").value;
  const pass = document.getElementById("loginPass").value;
  const ownerPass = document.getElementById("loginOwnerPass") ? document.getElementById("loginOwnerPass").value : "";
  if(!username){ toast("Please enter your username."); return; }
  const usernameError = validateUsername(username);
  if(usernameError){ toast(usernameError); return; }
  if(!pass){ toast("Please enter your password."); return; }

  const savedRaw = await Store.get(userKey(username));
  const saved = savedRaw ? JSON.parse(savedRaw) : null;
  let isOwner = resolveIsOwner(username, ownerPass) || resolveIsOwner(saved?.fullName || saved?.name || "", ownerPass);
  if(saved && saved.status==="suspended"){ toast("This account has been suspended by an admin."); return; }

  if(usingRealBackend){
    const { data: authData, error } = await sb.auth.signInWithPassword({ email: slugEmail(username), password: pass });
    if(error){
      toast(saved ? "Incorrect password." : "No account found with that username yet — please sign up first.");
      return;
    }
    const authUserId = authData.user.id;
    const { data: profileMatch, error: profileLookupError } = await sb.from("profiles")
      .select("id,name,account_type,is_admin,status,class,board,bio,reputation,streak").eq("id", authUserId).maybeSingle();
    if(profileLookupError || !profileMatch){
      console.error("Profile load after login failed:", profileLookupError);
      toast("Couldn't load your profile. Please try again.");
      return;
    }
    if(profileMatch.status==="suspended"){ await sb.auth.signOut(); toast("This account has been suspended by an admin."); return; }
    const acct = await fetchAccountData(authUserId);
    isOwner = isOwner || acct.isAdminFlag || profileMatch.is_admin === true;
    const merged = mergeAccountData(saved, acct);
    merged.class = profileMatch.class ?? merged.class;
    merged.board = profileMatch.board ?? merged.board;
    merged.bio = profileMatch.bio ?? merged.bio;
    merged.reputation = profileMatch.reputation ?? merged.reputation;
    merged.streak = profileMatch.streak ?? merged.streak;
    merged.username = username;
    merged.fullName = profileMatch.name || username;
    establishSession(merged.fullName, merged.class ?? cls, merged.board||saved?.board, merged, isOwner, {passwordHash:null, authUserId, username}, profileMatch.account_type || acct.accountType);
    return;
  }

  if(!saved){ toast("No account found with that username yet — please sign up first."); nav("signup"); return; }
  if(!isOwner){
    const hash = await hashPassword(pass);
    if(hash !== saved.passwordHash){ toast("Incorrect password."); return; }
  }
  establishSession(saved.fullName || saved.name || username, saved.class ?? cls, saved.board, saved, isOwner, {passwordHash: saved.passwordHash, username}, saved.accountType);
}
window.doLogin = doLogin;

function mergeAccountData(kvSaved, acct){
  const merged = {...(kvSaved||{})};
  if(acct.accountType) merged.accountType = acct.accountType;
  if(acct.reputation !== undefined && acct.reputation !== null) merged.reputation = acct.reputation;
  if(acct.points !== undefined && acct.points !== null) merged.points = acct.points;
  if(acct.bio !== undefined && acct.bio !== null) merged.bio = acct.bio;
  if(acct.streak !== undefined && acct.streak !== null) merged.streak = acct.streak;
  return merged;
}

  const ownerPass = document.getElementById("signupOwnerPass") ? document.getElementById("signupOwnerPass").value : "";
  if(!fullName){ toast("Please enter your full name."); return; }
  if(!username){ toast("Please choose a username."); return; }
  const usernameError = validateUsername(username);
  if(usernameError){ toast(usernameError); return; }
  if(!pass || pass.length<6){ toast("Please choose a password of at least 6 characters."); return; }
  let isOwner = resolveIsOwner(fullName, ownerPass) || resolveIsOwner(username, ownerPass);

  const savedRaw = await Store.get(userKey(username));
  if(savedRaw && !isOwner && !usingRealBackend){ toast("An account with this name already exists — please log in instead."); nav("login"); return; }
  const saved = savedRaw ? JSON.parse(savedRaw) : null;

  if(usingRealBackend){
    // Usernames are the login identifier. The deterministic auth email makes the
    // username unique at the authentication layer; the kv username index is also
    // checked first for a friendly duplicate message.
    const existingUsernameRecord = await Store.get(userKey(username));
    if(existingUsernameRecord){
      toast("That username is already taken — please choose another.");
      return;
    }
    // The trigger keeps the real full name in profiles.name. Username is kept
    // in auth metadata and the per-user kv record, so no schema migration is needed.
    const { data: authData, error } = await sb.auth.signUp({
      email: slugEmail(username), password: pass,
      options: { data: { name: fullName, username, full_name: fullName, account_type: accountType } }
    });
    if(error){
      if(/already registered|already exists/i.test(error.message)){ toast("That username is already taken — please choose another."); return; }
      toast("Signup failed: "+error.message); return;
    }
    const authUserId = authData.user.id;
    // class/board aren't read by the trigger — set them right after.
    if(cls || board){
      await sb.from("profiles").update({ class: Number(cls)||9, board: board||"CBSE" }).eq("id", authUserId);
    }
    const acct = await fetchAccountData(authUserId);
    isOwner = isOwner || acct.isAdminFlag;
    const merged = mergeAccountData(saved, acct);
    merged.username = username;
    merged.fullName = fullName;
    establishSession(fullName, cls, board, merged, isOwner, {passwordHash:null, authUserId, username}, accountType);
    return;
  }

  // Offline fallback
  const hash = await hashPassword(pass);
  establishSession(name, cls, board, saved, isOwner, {passwordHash: hash}, accountType);
}
window.doSignup = doSignup;

async function purchase(resId){
  const r = RESOURCES.find(x=>x.id===resId);
  const u = state.user;
  if(!u) return nav("login");
  if(!r) return toast("Resource not found.");
  if(r.creatorId===u.id || r.creatorId===u._authUserId) return toast("You can't purchase your own resource.");
  if(u.purchased.includes(resId)) return toast("Already in your library.");
  if(u.points < r.price) return toast("Not enough Reward Points.");

  if(usingRealBackend){
    const { data, error } = await sb.rpc("purchase_resource", { p_resource_id: resId });
    if(error){
      console.error("purchase_resource failed:", error);
      return toast(error.message || "Purchase failed. Nothing was deducted.");
    }
    if(!data?.success) return toast(data?.message || "Purchase failed. Nothing was deducted.");

    // The database transaction is authoritative. Refresh balance and purchases.
    const { data: rp } = await sb.from("reward_points").select("balance").eq("user_id",u._authUserId).maybeSingle();
    if(rp && typeof rp.balance === "number") u.points = rp.balance;
    else u.points = Math.max(0, u.points - r.price);
    if(!u.purchased.includes(resId)) u.purchased.push(resId);
    r.purchases = (r.purchases||0) + 1;
    await loadPointTransactions();
    toast("Purchase complete — added to your library.");
    render();
    return;
  }

  // Offline fallback
  u.points -= r.price;
  addTx("Purchased: "+r.title, -r.price);
  u.purchased.push(resId);
  r.purchases = (r.purchases||0) + 1;
  notify("Purchase complete", r.title+" added to your library.");
  render();
}
window.purchase = purchase;

  if(!usingRealBackend) return toast("Connect Supabase to create promo codes.");

  const code = (document.getElementById("newPromoCode")?.value || "").trim().toUpperCase();
  const description = (document.getElementById("newPromoDesc")?.value || "").trim();
  const premiumDays = Math.max(0, Number(document.getElementById("newPromoDays")?.value) || 0);
  const rpBonus = Math.max(0, Number(document.getElementById("newPromoRp")?.value) || 0);
  const maxRaw = (document.getElementById("newPromoMaxUses")?.value || "").trim();
  const maxUses = maxRaw === "" ? null : Math.max(1, Number(maxRaw) || 0);
  const expiryRaw = document.getElementById("newPromoExpiry")?.value || "";
  const newUsersOnly = !!document.getElementById("newPromoNewUsersOnly")?.checked;
  const specificUsername = (document.getElementById("newPromoSpecificUser")?.value || "").trim();

  if(!code) return toast("Enter a promo code.");
  if(!/^[A-Z0-9._-]{3,40}$/.test(code)) return toast("Use 3–40 letters, numbers, dots, underscores or hyphens.");
  if(rpBonus <= 0) return toast("RP bonus must be greater than 0.");
  if(maxRaw !== "" && maxUses < 1) return toast("Max uses must be at least 1.");

  let specificUserId = null;
  if(specificUsername){
    const cached = (state.allUsersCache||[]).find(u=>normalizeUsername(u.username||"")===normalizeUsername(specificUsername));
    if(!cached?.id) return toast("That username could not be found. Leave it blank for everyone.");
    specificUserId = cached.id;
  }

  const payload = {
    code,
    description,
    premium_days: premiumDays,
    rp_bonus: rpBonus,
    max_uses: maxUses,
    expiry_date: expiryRaw ? new Date(expiryRaw+"T23:59:59").toISOString() : null,
    active: true,
    new_users_only: newUsersOnly,
    specific_user_id: specificUserId
  };

  const { error } = await sb.from("promo_codes").insert(payload);
  if(error){
    console.error("createPromoCode failed:", error);
    if(/duplicate|unique/i.test(error.message)) return toast("That promo code already exists.");

  }

  toast("Promo code created: "+code);

/* Focus mode */
function startFocus(subject){
  state.focus.active=true;
  state.focus.paused=false;
  state.focus.startedAt=Date.now();
  state.focus.elapsed=0;
  state.focus.subject=subject||"General";
  saveFocusPersistent();
  startFocusInterval();
  render();
}
window.startFocus=startFocus;
async function pauseFocus(){
  if(!state.focus.active || state.focus.paused) return;
  state.focus.elapsed=Math.max(0,Date.now()-state.focus.startedAt);
  clearInterval(state.focus.timer);
  state.focus.paused=true;
  await saveFocusPersistent();
  render();
}
window.pauseFocus=pauseFocus;
async function resumeFocus(){
  if(!state.focus.active || !state.focus.paused) return;
  state.focus.paused=false;
  state.focus.startedAt=Date.now()-(state.focus.elapsed||0);
  startFocusInterval();
  await saveFocusPersistent();
  render();
}
window.resumeFocus=resumeFocus;
async function endFocus(){
  if(!state.focus.active) return;
  state.focus.elapsed=state.focus.paused ? Math.max(0,state.focus.elapsed||0) : Math.max(0,Date.now()-state.focus.startedAt);
  clearInterval(state.focus.timer);
  const seconds=Math.floor(state.focus.elapsed/1000);
  if(seconds>0){
    state.focus.log.push({date:new Date().toDateString(),minutes:Math.max(1,Math.round(seconds/60)),seconds,subject:state.focus.subject});
  }
  const subject=state.focus.subject;
  state.focus.active=false; state.focus.paused=false; state.focus.startedAt=null; state.focus.elapsed=0;
  await saveFocusPersistent();

/* ---------------- FACECAM RECORDING ----------------
   Everything here stays 100% local to the student's own browser.
   No network request is ever made with this video — it is recorded
   into memory, and the ONLY way it leaves the browser is if the
   student themselves clicks "Download" to save it to their own device.
   We (the site) never see, store, or receive this footage. */
let facecamStream = null;
let facecamRecorder = null;
let facecamChunks = [];

async function startFacecam(){
  if(!navigator.mediaDevices || !window.MediaRecorder){
    toast("Your browser doesn't support camera recording.");
    return;
  }
  if(state.facecamDownloadUrl){ URL.revokeObjectURL(state.facecamDownloadUrl); state.facecamDownloadUrl = null; }
  try{
    facecamStream = await navigator.mediaDevices.getUserMedia({ video:true, audio:true });
  } catch(err){
    toast("Camera/microphone access was denied or unavailable.");
    return;
  }
  facecamChunks = [];
  try{
    facecamRecorder = new MediaRecorder(facecamStream);
  } catch(err){
    facecamRecorder = new MediaRecorder(facecamStream, { mimeType: "video/webm" });
  }
  facecamRecorder.ondataavailable = e => { if(e.data && e.data.size>0) facecamChunks.push(e.data); };
  facecamRecorder.start();
  state.facecamActive = true;
  render();
}
window.startFacecam = startFacecam;

function stopFacecam(){
  if(facecamRecorder && facecamRecorder.state !== "inactive"){
    facecamRecorder.onstop = () => {
      const blob = new Blob(facecamChunks, { type: "video/webm" });
      state.facecamDownloadUrl = URL.createObjectURL(blob);
      state.facecamActive = false;
      render();
    };
    facecamRecorder.stop();
  } else {
    state.facecamActive = false;
    render();
  }
  if(facecamStream){ facecamStream.getTracks().forEach(t=>t.stop()); facecamStream = null; }
}
window.stopFacecam = stopFacecam;

async function doUploadResource(){
  const title = document.getElementById("uploadTitle").value;
  const description = document.getElementById("uploadDescription").value;
  const chapter = document.getElementById("uploadChapter").value;
  if(!title.trim() || !description.trim()) return toast("Please add a title and description.");

  const evalResult = AIService.evaluateResource(payload);
  // AI quality gate: scores below 20 are not accepted; all scores 20-100 go to admin review.
  if(evalResult.score < 20){
    toast("This resource scored "+evalResult.score+"/100 and cannot be submitted. Please improve the notes and try again.");
    return;
  }
  const status = "pending";

  if(usingRealBackend){
    const row = {
      title: payload.title, creator_id: state.user._authUserId, class: payload.class, board: state.user.board,
      subject: payload.subject, chapter: payload.chapter, type: payload.type, description: payload.description,
      pages: payload.pages, ai_score: evalResult.score, rating:0, num_ratings:0, purchases:0,
      price: evalResult.price, status, pros: evalResult.strengths, cons: evalResult.weaknesses,
      covers: [payload.chapter], ai_confidence: evalResult.confidence, has_file:false
    };
    const { data, error } = await sb.from("resources").insert(row).select().maybeSingle();
    if(error){ toast("Couldn't save resource: "+error.message); return; }
    const res = mapDbResource({...data, profiles:{name:state.user.name}});
    if(_pickedFile){
      toast("Uploading file...");
      try{
        const fileUrl = await uploadFileToStorage(data.id, _pickedFile);
        if(fileUrl){
          await sb.from("resources").update({ has_file:true, file_name:_pickedFile.name, file_type:_pickedFile.type, file_url:fileUrl }).eq("id", data.id);
          res.hasFile = true; res.fileName = _pickedFile.name; res.fileType = _pickedFile.type; res.fileUrl = fileUrl;
        }
      }catch(e){ toast("File upload failed — resource saved without the file."); }
      _pickedFile = null;
    }
    state.user.uploaded.push(res.id);
    RESOURCES.unshift(res);
    if(res.status==="pending") ADMIN_PENDING.unshift({...res});
    nav("sellerResult",{id:res.id});
    return;
  }

  // Offline fallback
  const res = {
    id: uid("res"), title: payload.title, creator: state.user.name, creatorId: state.user.id,
    class: payload.class, board: state.user.board, subject: payload.subject, chapter: payload.chapter,
    type: payload.type, description: payload.description, pages: payload.pages,
    aiScore: evalResult.score, rating:0, numRatings:0, purchases:0,
    price: evalResult.price, recommendedPrice: evalResult.price,
    status, pros: evalResult.strengths, cons: evalResult.weaknesses,
    covers: [payload.chapter], createdAt: Date.now(), aiConfidence: evalResult.confidence,
    hasFile: !!_pickedFile, fileName: _pickedFile?.name || null, fileType: _pickedFile?.type || null, fileUrl: null
  };
  if(_pickedFile){
    toast("File attached (visible only in this offline session — connect Supabase for real storage).");
    _pickedFile = null;
  }
  state.user.uploaded.push(res.id);
  RESOURCES.unshift(res);
  if(res.status==="pending") ADMIN_PENDING.unshift({...res});
  nav("sellerResult",{id:res.id});
  persistCatalog();
}

async function submitReview(resId, rating){
  const u = state.user;
  if(!u.purchased.includes(resId)) return toast("Purchase this resource before reviewing it.");
  if(u.ratedResources.includes(resId)) return toast("You've already reviewed this resource.");
  const textEl = document.getElementById("reviewText_"+resId);
  const text = textEl ? textEl.value.trim() : "";
  const r = RESOURCES.find(x=>x.id===resId);
  const totalPoints = r.rating * r.numRatings + rating;
  const newNumRatings = r.numRatings + 1;
  const newRating = Number((totalPoints / newNumRatings).toFixed(1));

  if(usingRealBackend){
    const { data: already } = await sb.from("resource_reviews").select("id").eq("resource_id",resId).eq("user_id",u._authUserId).maybeSingle();
    if(already) return toast("You've already reviewed this resource.");
    const { error: revErr } = await sb.from("resource_reviews").insert({ resource_id:resId, user_id:u._authUserId, rating, text });
    if(revErr){ toast("Couldn't save review: "+revErr.message); return; }
    const { error: updErr } = await sb.from("resources").update({ rating:newRating, num_ratings:newNumRatings }).eq("id", resId);
    if(updErr) console.error("resource rating update failed:", updErr);
    if(!REVIEWS[resId]) REVIEWS[resId] = [];
    REVIEWS[resId].unshift({userId:u._authUserId, userName:u.name, rating, text, ts:Date.now()});
  } else {
    if(!REVIEWS[resId]) REVIEWS[resId] = [];
    REVIEWS[resId].unshift({userId:u.id, userName:u.name, rating, text, ts:Date.now()});
  }
  r.numRatings = newNumRatings;
  r.rating = newRating;
  u.ratedResources.push(resId);
  toast("Thanks for your review!");
  render();
}

  state.quiz.submitted = true;

    const chosen = state.quiz.answers[q.id];
    if(chosen===q.correct) correct++;

  });
  state.quiz.score = Math.round(correct/qs.length*100);
  state.quiz.weak = Object.keys(weak).sort((a,b)=>weak[b]-weak[a]);
  state.user.quizHistory.unshift({id:uid("qz"), resourceId:state.quiz.resourceId, score:state.quiz.score, ts:Date.now(), weak:state.quiz.weak});

function viewMarketplace(){
  const q = state.search?.toLowerCase()||"";
  let list = RESOURCES.filter(r=>r.status==="approved");
  const f = state.marketFilter || {};
  if(f.subject) list = list.filter(r=>r.subject===f.subject);
  if(f.class) list = list.filter(r=>r.class===Number(f.class));
  if(f.sort==="price") list.sort((a,b)=>a.price-b.price);
  else if(f.sort==="rating") list.sort((a,b)=>b.rating-a.rating);
  else if(f.sort==="newest") list.sort((a,b)=>b.createdAt-a.createdAt);

  const week = Math.round(f.log.slice(-7).reduce((a,b)=>a+(b.seconds!=null?b.seconds:b.minutes*60),0)/60);
  const month = Math.round(f.log.reduce((a,b)=>a+(b.seconds!=null?b.seconds:b.minutes*60),0)/60);
  const maxM = Math.max(...f.log.slice(-7).map(l=>l.seconds!=null?l.seconds/60:l.minutes),1);
  const bySubject = {};

  const subjectEntries = Object.entries(bySubject).sort((a,b)=>b[1]-a[1]);

  return `${navBar()}<div class="pagewrap"><div class="wrap">

async function hydrateResourceFile(id){
  const r = RESOURCES.find(x=>x.id===id);
  if(!r || !state.user) return;
  const owned = state.user.purchased.includes(id) || r.creatorId === state.user._authUserId;
  if(!owned) return;
  const box = document.getElementById("resourceFile_"+id);
  if(!box) return;
  const url = await getResourceFileUrl(r);
  if(!url){
    box.innerHTML = '<div class="small muted">Could not open the uploaded notes. The file storage permissions need attention.</div>';
    return;
  }
  const safeUrl = url.replace(/"/g,'&quot;');
  box.innerHTML = (r.fileType||"").startsWith("image/")
    ? `<img src="${safeUrl}" alt="Uploaded notes" style="max-width:100%; max-height:800px; object-fit:contain; border-radius:10px; display:block; margin:auto;">`
      + `<div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;"><button class="btn btn-outline btn-sm" type="button" onclick="openResourceFile('${id}')">Open full size</button></div>`
    : `<iframe src="${safeUrl}" title="Uploaded notes" style="width:100%; height:650px; border:0; border-radius:8px; background:#fff;"></iframe>`
      + `<div style="margin-top:10px;"><button class="btn btn-outline btn-sm" type="button" onclick="openResourceFile('${id}')">Open / download PDF</button></div>`;
}
window.hydrateResourceFile = hydrateResourceFile;

function render(){
  document.documentElement.setAttribute("data-theme", state.theme);
  const app = document.getElementById("app");
  let html = "";
  switch(state.route){
    case "landing": html = viewLanding(); break;
    case "login": html = viewLogin(); break;
    case "signup": html = viewSignup(); break;
    case "dashboard": html = viewDashboard(); break;
    case "marketplace": html = viewMarketplace(); break;
    case "resource": html = viewResource(state.params.id); break;
    case "doubts": html = viewDoubts(state.params.compose); break;
    case "doubtDetail": html = viewDoubtDetail(state.params.id); break;
    case "assistant": html = viewAssistant(); break;
    case "focus": html = viewFocus(); break;
    case "library": html = viewLibrary(); break;
    case "store": html = viewStore(); break;
    case "storeDashboard": html = viewStoreDashboard(); break;
    case "storeMarketplace": html = viewStoreMarketplace(); break;
    case "premium": html = viewPremium(); break;
    case "storeOrders": html = viewStoreOrders(); break;
    case "seller": html = viewSeller(); break;
    case "sellerUpload": html = viewSellerUpload(); break;
    case "sellerResult": html = viewSellerResult(state.params.id); break;
    case "admin": html = viewAdmin(); break;
    case "profile": html = viewProfile(); break;
    case "quizLibrary": html = viewQuizLibrary(); break;
    case "quizSetup": html = viewQuizSetup(state.params.id); break;
    case "quizTake": html = viewQuizTake(); break;
    case "quizResult": html = viewQuizResult(); break;
    case "search": html = viewSearch(); break;
    default: html = viewLanding();
  }
  app.innerHTML = (usingRealBackend? "" : `<div style="background:#7A2E2E; color:#fff; text-align:center; padding:8px 16px; font-size:12.5px; font-weight:600;">⚠️ Offline demo mode — Supabase isn't configured yet, so nothing will be saved permanently. See the setup instructions to connect a real backend.</div>`) + html;
  if(state.route==="assistant") renderChatLog();
  if(state.route==="resource" && state.params?.id && usingRealBackend){
    hydrateResourceFile(state.params.id);
  }
  if(state.route==="focus" && state.facecamActive && facecamStream){
    const v = document.getElementById("facecamPreview");
    if(v) v.srcObject = facecamStream;
  }
  scheduleSave();
}

async function restoreSupabaseSession(){
  if(!usingRealBackend || !sb || state.user || restoringSession) return !!state.user;
  restoringSession = true;
  try{
    // Supabase persists the auth session in the browser by default. Restore it
    // before rendering the login page so a refresh does not look like a logout.
    const { data: sessionData, error: sessionError } = await sb.auth.getSession();
    if(sessionError){ console.error("Session restore failed:", sessionError); return false; }
    const authUser = sessionData?.session?.user;
    if(!authUser) return false;

    const { data: profile, error: profileError } = await sb.from("profiles")
      .select("*").eq("id", authUser.id).maybeSingle();
    if(profileError){ console.error("Session profile load failed:", profileError); return false; }
    if(!profile){ console.error("Session restore: profile not found"); return false; }

    const acct = await fetchAccountData(authUser.id);
    const authUsername = authUser.user_metadata?.username || "";
    let kvSaved = null;
    if(authUsername){
      const rawSaved = await Store.get(userKey(authUsername));
      if(rawSaved){
        try{ kvSaved = JSON.parse(rawSaved); }catch(e){ console.warn("Saved profile data parse failed:", e); }
      }
    }
    const saved = {
      ...(kvSaved || {}),
      name: profile.name || kvSaved?.name || authUser.user_metadata?.name || authUser.email?.split("@")[0] || "User",
      fullName: profile.name || kvSaved?.fullName || authUser.user_metadata?.full_name || authUser.user_metadata?.name || "User",
      username: authUsername || kvSaved?.username || "",
      class: profile.class ?? kvSaved?.class,
      board: profile.board ?? kvSaved?.board,
      accountType: profile.account_type || kvSaved?.accountType,
      bio: profile.bio ?? kvSaved?.bio ?? "",
      reputation: acct.reputation ?? kvSaved?.reputation,
      points: acct.points ?? kvSaved?.points,
      streak: acct.streak ?? kvSaved?.streak,
      is_admin: profile.is_admin === true
    };
    const name = saved.name;
    const username = saved.username || name;
    saved.username = username;
    const isOwner = profile.is_admin === true || resolveIsOwner(name, "") || resolveIsOwner(username, "");
    establishSession(name, saved.class, saved.board, saved, isOwner,
      {passwordHash:null, authUserId:authUser.id, username}, saved.accountType);
    return true;
  }catch(e){
    console.error("Session restore failed:", e);
    return false;
  }finally{
    restoringSession = false;
  }
}

let authListenerReady = false;
let restoringSession = false;
if(usingRealBackend && sb){
  sb.auth.onAuthStateChange((event, session)=>{
    if(event === "SIGNED_OUT"){
      return;
    }
    if((event === "SIGNED_IN" || event === "TOKEN_REFRESHED" || event === "INITIAL_SESSION") && session && !state.user && !restoringSession){
      // Defer the database reads outside the auth callback to avoid auth-lock
      // contention in Supabase JS.
      setTimeout(()=>{ if(!state.user) restoreSupabaseSession(); }, 0);
    }
  });
  authListenerReady = true;
}

async function boot(){
  try{
    if(usingRealBackend){
      const raw = await Store.get("platform:reports", true);
      if(raw) ADMIN_REPORTS.push(...JSON.parse(raw));
      // Restore the persisted Supabase session before showing the landing page.
      if(await restoreSupabaseSession()) return;
      // Resources/doubts load once someone logs in (need their auth context
      // for RLS-scoped queries like "my own pending resources").
    } else {
      const raw = await Store.get("platform:catalog", true);
      if(raw){
        const data = JSON.parse(raw);
        if(data.RESOURCES) { RESOURCES.length=0; RESOURCES.push(...data.RESOURCES); }
        if(data.DOUBTS) { DOUBTS.length=0; DOUBTS.push(...data.DOUBTS); }
        if(data.ADMIN_PENDING) { ADMIN_PENDING.length=0; ADMIN_PENDING.push(...data.ADMIN_PENDING); }
        if(data.ADMIN_REPORTS) { ADMIN_REPORTS.length=0; ADMIN_REPORTS.push(...data.ADMIN_REPORTS); }
        if(data.REVIEWS) Object.assign(REVIEWS, data.REVIEWS);
      }
    }
  }catch(e){ /* first run, or storage unavailable — start fresh, that's fine */ }
  await loadPricing();
  render();
}
boot();
</script>
